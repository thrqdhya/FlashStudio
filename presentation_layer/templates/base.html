<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashStudio Pro - Yönetim Paneli</title>
    <!-- Google Fonts & FontAwesome İkonları -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .sidebar { min-width: 260px; max-width: 260px; background: #1e293b; min-height: 100vh; color: #fff; transition: all 0.3s; }
        .sidebar .nav-link { color: #94a3b8; padding: 12px 20px; font-weight: 500; display: flex; align-items: center; gap: 10px; border-radius: 8px; margin: 4px 15px; text-decoration: none; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #334155; color: #fff; }
        .sidebar-brand { padding: 20px; font-size: 1.25rem; font-weight: 700; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
        .main-content { width: 100%; }
        .top-navbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 15px 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); }
        .card-header { background-color: #fff; border-bottom: 1px solid #f1f5f9; font-weight: 600; }
        .btn-action { padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- SOL MENÜ (SIDEBAR) -->
    <div class="sidebar d-flex flex-column flex-shrink-0">
        <div class="sidebar-brand text-white">
            <i class="fa-solid fa-camera-retro text-info"></i>
            <span>FLASHSTUDIO PRO</span>
        </div>
        <ul class="nav nav-pills flex-column mb-auto mt-3">
            <li>
                <a href="/musteri" class="nav-link {% if request.path == '/musteri' or request.path == '/' %}active{% endif %}">
                    <i class="fa-solid fa-users w-20"></i> Müşteri Yönetimi
                </a>
            </li>
            <li>
                <a href="/ekipman" class="nav-link {% if request.path == '/ekipman' %}active{% endif %}">
                    <i class="fa-solid fa-box w-20"></i> Ekipman Yönetimi
                </a>
            </li>
            <li>
                <a href="/rezervasyon" class="nav-link {% if request.path == '/rezervasyon' %}active{% endif %}">
                    <i class="fa-solid fa-calendar-check w-20"></i> Rezervasyon Yönetimi
                </a>
            </li>
            <li>
                <a href="/fotografci" class="nav-link {% if request.path == '/fotografci' %}active{% endif %}">
                    <i class="fa-solid fa-camera w-20"></i> Fotoğrafçı Kadrosu
                </a>
            </li>
            <li>
                <a href="/kiralama" class="nav-link {% if request.path == '/kiralama' %}active{% endif %}">
                    <i class="fa-solid fa-key w-20"></i> Kiralama İşlemleri
                </a>
            </li>
        </ul>
        <div class="p-3 border-top border-dark text-center text-muted" style="font-size: 0.8rem;">
            BTS304 Final Projesi &copy; 2026
        </div>
    </div>

    <!-- SAĞ İÇERİK ALANI -->
    <div class="main-content d-flex flex-column">
        <!-- ÜST NAVIGASYON -->
        <div class="top-navbar d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-secondary font-weight-bold">📸 Fotoğraf Stüdyosu Otomasyon Sistemi</h5>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-soft-success text-success p-2 bg-light border border-success rounded-pill">Veritabanı: Bağlı</span>
                <img src="https://ui-avatars.com/api/?name=Dhiya&background=0D6EFD&color=fff" class="rounded-circle" width="35" height="35">
            </div>
        </div>

        <!-- DİNAMİK İÇERİK -->
        <div class="p-4">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
